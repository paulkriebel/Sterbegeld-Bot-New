<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sophie - CHECK24 Sterbegeld-Berater</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* iPhone 17 Container */
        .iphone-frame {
            width: 393px;
            height: 852px;
            background: #000;
            border-radius: 55px;
            padding: 12px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* Dynamic Island */
        .dynamic-island {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 126px;
            height: 37px;
            background: #000;
            border-radius: 20px;
            z-index: 1000;
        }

        /* Screen Content */
        .iphone-screen {
            width: 100%;
            height: 100%;
            background: #F5F5F5;
            border-radius: 47px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Status Bar */
        .status-bar {
            height: 54px;
            background: #003D7A;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 20px 8px 20px;
            color: white;
            font-size: 15px;
        }

        .status-time {
            font-weight: 600;
        }

        .status-icons {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        /* Chat Header */
        .chat-header {
            background: #003D7A;
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .header-back {
            font-size: 24px;
            cursor: pointer;
        }

        .header-avatar {
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #003D7A;
            font-size: 18px;
        }

        .header-info {
            flex: 1;
        }

        .header-name {
            font-weight: 600;
            font-size: 17px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .check24-icon {
            font-size: 14px;
        }

        .header-menu {
            font-size: 24px;
            cursor: pointer;
        }

        /* Chat Messages */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #F5F5F5;
        }

        .message {
            margin-bottom: 16px;
            display: flex;
            gap: 8px;
        }

        .message-bot {
            flex-direction: row;
        }

        .message-user {
            flex-direction: row-reverse;
        }

        .message-bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.4;
        }

        .message-bot .message-bubble {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .message-user .message-bubble {
            background: #003D7A;
            color: white;
            border-bottom-right-radius: 4px;
        }

        /* Tariff Card */
        .tariff-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin: 12px 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border: 1px solid #E0E0E0;
        }

        .tariff-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .tariff-provider {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .provider-logo {
            width: 48px;
            height: 48px;
            background: #F0F0F0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: #003D7A;
        }

        .provider-name {
            font-weight: 600;
            font-size: 16px;
            color: #333;
        }

        .tariff-price-box {
            text-align: right;
        }

        .tariff-price-old {
            text-decoration: line-through;
            color: #999;
            font-size: 13px;
        }

        .tariff-price {
            font-size: 24px;
            font-weight: bold;
            color: #003D7A;
        }

        .tariff-price-label {
            font-size: 12px;
            color: #666;
        }

        .tariff-name {
            font-weight: 600;
            font-size: 15px;
            color: #333;
            margin-bottom: 8px;
        }

        .tariff-badge {
            display: inline-block;
            background: #E8F5E9;
            color: #2E7D32;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .tariff-badge.best {
            background: #FFF3E0;
            color: #E65100;
        }

        .tariff-details {
            list-style: none;
            margin: 12px 0;
        }

        .tariff-details li {
            padding: 6px 0;
            font-size: 14px;
            color: #666;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .tariff-details li:before {
            content: "•";
            color: #003D7A;
            font-weight: bold;
            flex-shrink: 0;
        }

        .tariff-details strong {
            color: #333;
            font-weight: 600;
        }

        .tariff-rating {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #F0F0F0;
        }

        .stars {
            color: #FF6600;
            font-size: 14px;
        }

        .rating-text {
            color: #666;
            font-size: 13px;
        }

        .tariff-action {
            text-align: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #F0F0F0;
        }

        .tariff-cta {
            color: #FF6600;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
        }

        /* Chat Input */
        .chat-input-container {
            padding: 12px 16px;
            background: white;
            border-top: 1px solid #E0E0E0;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid #E0E0E0;
            border-radius: 20px;
            font-size: 15px;
            outline: none;
            font-family: inherit;
        }

        .chat-input:focus {
            border-color: #003D7A;
        }

        .send-button {
            width: 36px;
            height: 36px;
            background: #003D7A;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .send-button:hover {
            background: #002A5C;
        }

        .send-button:disabled {
            background: #CCC;
            cursor: not-allowed;
        }

        /* Bottom Navigation */
        .bottom-nav {
            height: 70px;
            background: white;
            border-top: 1px solid #E0E0E0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 10px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #999;
            font-size: 11px;
            cursor: pointer;
            padding: 8px 12px;
        }

        .nav-item.active {
            color: #003D7A;
        }

        .nav-icon {
            font-size: 24px;
        }

        .nav-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #FF3B30;
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: none;
            padding: 12px 16px;
            background: white;
            border-radius: 18px;
            width: fit-content;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .typing-indicator.active {
            display: block;
        }

        .typing-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-8px);
            }
        }

        /* Scrollbar */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #CCC;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="iphone-frame">
        <div class="dynamic-island"></div>
        <div class="iphone-screen">
            <!-- Status Bar -->
            <div class="status-bar">
                <span class="status-time">16:36</span>
                <div class="status-icons">
                    <span>📶</span>
                    <span>📡</span>
                    <span>🔋</span>
                </div>
            </div>

            <!-- Chat Header -->
            <div class="chat-header">
                <span class="header-back">←</span>
                <div class="header-avatar">S</div>
                <div class="header-info">
                    <div class="header-name">
                        <span>Sophie</span>
                        <span class="check24-icon">✓</span>
                    </div>
                </div>
                <span class="header-menu">⋮</span>
            </div>

            <!-- Chat Messages -->
            <div class="chat-messages" id="chatMessages">
                <div class="message message-bot">
                    <div class="message-bubble">
                        Hallo! Ich bin Sophie, deine persönliche CHECK24 Beraterin für Sterbegeldversicherungen. 👋<br><br>
                        Möchtest du direkt passende Tarife finden, oder hast du zunächst Fragen?
                    </div>
                </div>
            </div>

            <!-- Typing Indicator -->
            <div class="typing-indicator" id="typingIndicator">
                <span class="typing-dot"></span>
                <span class="typing-dot"></span>
                <span class="typing-dot"></span>
            </div>

            <!-- Chat Input -->
            <div class="chat-input-container">
                <input 
                    type="text" 
                    class="chat-input" 
                    id="userInput" 
                    placeholder="Nachricht schreiben..."
                    autocomplete="off"
                >
                <button class="send-button" id="sendButton">➤</button>
            </div>

            <!-- Bottom Navigation -->
            <div class="bottom-nav">
                <div class="nav-item">
                    <span class="nav-icon">🏠</span>
                    <span>Start</span>
                </div>
                <div class="nav-item">
                    <span class="nav-icon">📋</span>
                    <span>Aktivitäten</span>
                </div>
                <div class="nav-item" style="position: relative;">
                    <span class="nav-icon">📩</span>
                    <span>Mitteilungen</span>
                    <span class="nav-badge">3</span>
                </div>
                <div class="nav-item">
                    <span class="nav-icon">👤</span>
                    <span>Profil</span>
                </div>
                <div class="nav-item active">
                    <span class="nav-icon">💬</span>
                    <span>Chat</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const typingIndicator = document.getElementById('typingIndicator');
        
        let conversationHistory = [];

        // Send message on Enter key
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Send message on button click
        sendButton.addEventListener('click', sendMessage);

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // Add user message to chat
            addMessage(message, 'user');
            userInput.value = '';

            // Disable input while processing
            userInput.disabled = true;
            sendButton.disabled = true;
            typingIndicator.classList.add('active');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        history: conversationHistory
                    }),
                });

                const data = await response.json();

                if (data.error) {
                    addMessage('Entschuldigung, es gab einen Fehler: ' + data.message, 'bot');
                } else {
                    // Check if response contains tariff data
                    if (data.reply.includes('€/Monat')) {
                        addTariffMessage(data.reply);
                    } else {
                        addMessage(data.reply, 'bot');
                    }

                    // Update conversation history from backend
                    // Backend returns full history including function calls
                    if (data.history) {
                        conversationHistory = data.history;
                    } else {
                        // Fallback: Add only user + assistant (old behavior)
                        conversationHistory.push(
                            { role: 'user', content: message },
                            { role: 'assistant', content: data.reply }
                        );
                        
                        // Keep only last 20 messages
                        if (conversationHistory.length > 20) {
                            conversationHistory = conversationHistory.slice(-20);
                        }
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                addMessage('Entschuldigung, ich hatte ein technisches Problem. Bitte versuche es erneut.', 'bot');
            } finally {
                typingIndicator.classList.remove('active');
                userInput.disabled = false;
                sendButton.disabled = false;
                userInput.focus();
            }
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message message-${sender}`;
            
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'message-bubble';
            bubbleDiv.innerHTML = text.replace(/\n/g, '<br>');
            
            messageDiv.appendChild(bubbleDiv);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addTariffMessage(text) {
            // Parse tariff data from text
            const tariffs = parseTariffs(text);
            
            if (tariffs.length > 0) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message message-bot';
                
                const bubbleDiv = document.createElement('div');
                bubbleDiv.className = 'message-bubble';
                bubbleDiv.style.maxWidth = '95%';
                
                // Add intro text if present
                const introMatch = text.match(/^(.+?)(?=\n\n1\.|$)/s);
                if (introMatch) {
                    const intro = document.createElement('p');
                    intro.innerHTML = introMatch[1].trim().replace(/\n/g, '<br>');
                    intro.style.marginBottom = '12px';
                    bubbleDiv.appendChild(intro);
                }
                
                // Add tariff cards
                tariffs.forEach((tariff, index) => {
                    bubbleDiv.appendChild(createTariffCard(tariff, index));
                });
                
                messageDiv.appendChild(bubbleDiv);
                chatMessages.appendChild(messageDiv);
            } else {
                addMessage(text, 'bot');
            }
            
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function parseTariffs(text) {
            const tariffs = [];
            const tariffBlocks = text.match(/\d+\.\s\*\*(.+?)\*\*[\s\S]+?(?=\n\n\d+\.\s\*\*|\n\nDer günstigste|$)/g);
            
            if (!tariffBlocks) return tariffs;
            
            tariffBlocks.forEach(block => {
                const tariff = {};
                
                // Extract name and provider
                const nameMatch = block.match(/\*\*(.+?)\s*\((.+?)\)\*\*/);
                if (nameMatch) {
                    tariff.name = nameMatch[1].trim();
                    tariff.provider = nameMatch[2].trim();
                }
                
                // Check if GÜNSTIGSTER
                tariff.isBest = block.includes('GÜNSTIGSTER');
                
                // Extract price
                const priceMatch = block.match(/(\d+[,\.]\d+)\s*€\/Monat/);
                if (priceMatch) {
                    tariff.price = priceMatch[1].replace(',', '.');
                }
                
                // Extract coverage
                const coverageMatch = block.match(/(\d+[,\.]\d+)\s*€\s*Deckung/);
                if (coverageMatch) {
                    tariff.coverage = coverageMatch[1];
                }
                
                // Extract details
                tariff.details = [];
                const detailLines = block.match(/•\s*(.+)/g);
                if (detailLines) {
                    detailLines.forEach(line => {
                        const detail = line.replace('•', '').trim();
                        if (!detail.includes('€/Monat') && !detail.includes('€ Deckung')) {
                            tariff.details.push(detail);
                        }
                    });
                }
                
                tariffs.push(tariff);
            });
            
            return tariffs;
        }

        function createTariffCard(tariff, index) {
            const card = document.createElement('div');
            card.className = 'tariff-card';
            
            const header = document.createElement('div');
            header.className = 'tariff-header';
            
            const providerDiv = document.createElement('div');
            providerDiv.className = 'tariff-provider';
            
            const logo = document.createElement('div');
            logo.className = 'provider-logo';
            logo.textContent = (tariff.provider || 'N/A').substring(0, 2).toUpperCase();
            
            const providerName = document.createElement('div');
            providerName.className = 'provider-name';
            providerName.textContent = tariff.name || 'Tarif';
            
            providerDiv.appendChild(logo);
            providerDiv.appendChild(providerName);
            
            const priceBox = document.createElement('div');
            priceBox.className = 'tariff-price-box';
            
            const price = document.createElement('div');
            price.className = 'tariff-price';
            price.textContent = (tariff.price || '0') + ' €';
            
            const priceLabel = document.createElement('div');
            priceLabel.className = 'tariff-price-label';
            priceLabel.textContent = 'pro Monat';
            
            priceBox.appendChild(price);
            priceBox.appendChild(priceLabel);
            
            header.appendChild(providerDiv);
            header.appendChild(priceBox);
            card.appendChild(header);
            
            // Badge
            if (tariff.isBest) {
                const badge = document.createElement('div');
                badge.className = 'tariff-badge best';
                badge.textContent = 'GÜNSTIGSTER TARIF';
                card.appendChild(badge);
            }
            
            // Provider name as subtitle
            const subtitle = document.createElement('div');
            subtitle.className = 'tariff-name';
            subtitle.textContent = tariff.provider || '';
            card.appendChild(subtitle);
            
            // Details
            if (tariff.details && tariff.details.length > 0) {
                const detailsList = document.createElement('ul');
                detailsList.className = 'tariff-details';
                
                tariff.details.forEach(detail => {
                    const li = document.createElement('li');
                    // Split by colon to bold the label
                    const parts = detail.split(':');
                    if (parts.length > 1) {
                        li.innerHTML = `<strong>${parts[0]}:</strong> ${parts.slice(1).join(':')}`;
                    } else {
                        li.textContent = detail;
                    }
                    detailsList.appendChild(li);
                });
                
                card.appendChild(detailsList);
            }
            
            // Coverage info
            if (tariff.coverage) {
                const coverageDiv = document.createElement('div');
                coverageDiv.style.cssText = 'font-size: 13px; color: #666; margin-top: 8px;';
                coverageDiv.innerHTML = `<strong>Versicherungssumme:</strong> ${tariff.coverage.replace('.', ',')} € CHECK24 Gutschrift`;
                card.appendChild(coverageDiv);
            }
            
            // Rating (fake for demo)
            const rating = document.createElement('div');
            rating.className = 'tariff-rating';
            rating.innerHTML = `
                <span class="stars">★★★★☆</span>
                <span class="rating-text">4.0 (${Math.floor(Math.random() * 500 + 100)}k)</span>
            `;
            card.appendChild(rating);
            
            // CTA
            const action = document.createElement('div');
            action.className = 'tariff-action';
            action.innerHTML = '<a class="tariff-cta">Weitere Details anzeigen</a>';
            card.appendChild(action);
            
            return card;
        }

        // Auto-scroll to bottom on load
        window.addEventListener('load', () => {
            chatMessages.scrollTop = chatMessages.scrollHeight;
            userInput.focus();
        });
    </script>
</body>
</html>
