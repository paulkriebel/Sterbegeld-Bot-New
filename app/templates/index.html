<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sophie - Sterbegeld-Berater</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* iPhone 17 Container */
        .iphone-frame {
            width: 393px;
            height: 852px;
            background: #000;
            border-radius: 55px;
            padding: 12px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* Dynamic Island */
        .dynamic-island {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 126px;
            height: 37px;
            background: #000;
            border-radius: 20px;
            z-index: 1000;
        }

        /* Screen Content */
        .iphone-screen {
            width: 100%;
            height: 100%;
            background: #F5F5F5;
            border-radius: 45px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Status Bar */
        .status-bar {
            height: 50px;
            background: #F5F5F5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            padding-top: 15px;
            font-size: 15px;
            font-weight: 600;
        }

        .status-left {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .status-right {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        /* Chat Header with Sophie */
        .chat-header {
            background: #FFFFFF;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #E0E0E0;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-button {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 20px;
            cursor: pointer;
        }

        .sophie-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sophie-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #4285F4 0%, #1967D2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }

        .sophie-name {
            font-size: 17px;
            font-weight: 600;
            color: #1967D2;
        }

        .menu-button {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 20px;
            cursor: pointer;
        }

        /* Chat Messages Area */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
            background: #F5F5F5;
        }

        /* Message Styles */
        .message {
            margin-bottom: 16px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Bot Messages - Full Width */
        .message-bot {
            width: 100%;
        }

        .message-bot .message-content {
            background: #FFFFFF;
            color: #333;
            padding: 12px 16px;
            border-radius: 8px;
            width: 100%;
            font-size: 15px;
            line-height: 1.5;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        /* User Messages - Right Aligned Bubble */
        .message-user {
            display: flex;
            justify-content: flex-end;
        }

        .message-user .message-content {
            background: #E8E8E8;
            color: #333;
            padding: 10px 14px;
            border-radius: 18px;
            max-width: 75%;
            font-size: 15px;
            line-height: 1.4;
        }

        /* Bullet Points with Bold Labels */
        .message-content ul {
            list-style: none;
            margin: 8px 0;
            padding: 0;
        }

        .message-content li {
            margin: 6px 0;
            padding-left: 0;
            font-size: 15px;
            line-height: 1.5;
        }

        .message-content li::before {
            content: "• ";
            font-weight: bold;
            margin-right: 8px;
        }

        .message-content strong,
        .message-content b {
            font-weight: 600;
        }

        .message-content p {
            margin: 6px 0;
        }

        /* Message Time */
        .message-time {
            display: block;
            font-size: 11px;
            color: #999;
            margin-top: 4px;
        }

        /* Typing Indicator */
        #typing-indicator {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: #FFFFFF;
            border-radius: 8px;
            width: fit-content;
            margin-bottom: 16px;
        }

        #typing-indicator.show {
            display: flex;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingBounce {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        /* Input Area */
        .chat-input-area {
            background: #FFFFFF;
            padding: 12px 16px;
            border-top: 1px solid #E0E0E0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #user-input {
            flex: 1;
            background: #F5F5F5;
            border: 1px solid #E0E0E0;
            border-radius: 20px;
            padding: 10px 16px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            resize: none;
            max-height: 100px;
        }

        #send-btn {
            width: 36px;
            height: 36px;
            background: #1967D2;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #send-btn:disabled {
            background: #CCC;
            cursor: not-allowed;
        }

        #send-btn:not(:disabled):hover {
            background: #1557B0;
        }

        /* Bottom Navigation */
        .bottom-nav {
            background: #FFFFFF;
            padding: 8px 0;
            border-top: 1px solid #E0E0E0;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #999;
            font-size: 11px;
            cursor: pointer;
        }

        .nav-item.active {
            color: #1967D2;
        }

        .nav-icon {
            font-size: 24px;
        }

        /* Home Indicator */
        .home-indicator {
            height: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #F5F5F5;
        }

        .home-indicator-bar {
            width: 134px;
            height: 5px;
            background: #333;
            border-radius: 3px;
        }

        /* Scrollbar Styling */
        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #CCC;
            border-radius: 2px;
        }

        /* Debug Panel (Hidden by default) */
        .debug-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 15px;
            border-radius: 8px;
            max-width: 400px;
            max-height: 500px;
            overflow-y: auto;
            font-size: 12px;
            z-index: 10000;
            display: none;
        }

        .debug-panel.show {
            display: block;
        }

        .debug-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1967D2;
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            z-index: 10001;
        }

        .debug-section {
            margin-bottom: 15px;
        }

        .debug-section h4 {
            margin-bottom: 5px;
            color: #4285F4;
        }

        .debug-section pre {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="iphone-frame">
        <div class="dynamic-island"></div>
        
        <div class="iphone-screen">
            <!-- Status Bar -->
            <div class="status-bar">
                <div class="status-left">
                    <span id="current-time">--:--</span>
                </div>
                <div class="status-right">
                    <span>📶</span>
                    <span>🔋</span>
                </div>
            </div>

            <!-- Chat Header with Sophie -->
            <div class="chat-header">
                <div class="chat-header-left">
                    <div class="back-button">✕</div>
                    <div class="sophie-container">
                        <div class="sophie-icon">✨</div>
                        <div class="sophie-name">Sophie</div>
                    </div>
                </div>
                <div class="menu-button" id="toggle-debug" title="Debug-Panel">⋮</div>
            </div>

            <!-- Chat Messages -->
            <div class="chat-messages" id="chat-container">
                <!-- Messages will be added here dynamically -->
            </div>

            <!-- Typing Indicator -->
            <div id="typing-indicator">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>

            <!-- Input Area -->
            <form id="chat-form" class="chat-input-area">
                <textarea 
                    id="user-input" 
                    placeholder="Nachricht eingeben..." 
                    rows="1"
                    autocomplete="off"
                ></textarea>
                <button type="submit" id="send-btn" disabled>↑</button>
            </form>

            <!-- Bottom Navigation -->
            <div class="bottom-nav">
                <div class="nav-item">
                    <div class="nav-icon">🏠</div>
                    <div>Start</div>
                </div>
                <div class="nav-item">
                    <div class="nav-icon">📋</div>
                    <div>Aktivitäten</div>
                </div>
                <div class="nav-item">
                    <div class="nav-icon">📧</div>
                    <div>Mitteilungen</div>
                </div>
                <div class="nav-item">
                    <div class="nav-icon">👤</div>
                    <div>Profil</div>
                </div>
                <div class="nav-item active">
                    <div class="nav-icon">💬</div>
                    <div>Chat</div>
                </div>
            </div>

            <!-- Home Indicator -->
            <div class="home-indicator">
                <div class="home-indicator-bar"></div>
            </div>
        </div>
    </div>

    <!-- Debug Panel -->
    <div id="debug-content" class="debug-panel">
        <div class="debug-section">
            <h4>System Prompt</h4>
            <pre id="debug-system-prompt">...</pre>
        </div>
        <div class="debug-section">
            <h4>User Message</h4>
            <pre id="debug-user-message">...</pre>
        </div>
        <div class="debug-section">
            <h4>LLM Response</h4>
            <pre id="debug-llm-response">...</pre>
        </div>
        <div class="debug-section">
            <h4>Tokens Used</h4>
            <pre id="debug-tokens">...</pre>
        </div>
    </div>

    <script src="/static/js/contract_forms.js"></script>
    <script src="/static/js/chat.js"></script>
    <script>
        // Update time every second
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('de-DE', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            document.getElementById('current-time').textContent = timeStr;
        }
        updateTime();
        setInterval(updateTime, 60000); // Update every minute
    </script>
</body>
</html>
