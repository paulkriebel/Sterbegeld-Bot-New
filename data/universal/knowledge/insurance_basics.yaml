insurance_basics:
  definition: "Eine Versicherung ist ein Vertrag zur Absicherung von Risiken gegen Zahlung eines Beitrags."
  
  key_concepts:
    beitrag:
      definition: "Regelmäßige Zahlung für den Versicherungsschutz"
      synonyms: ["Prämie", "Versicherungsbeitrag"]
      payment_types: ["Monatlich", "Vierteljährlich", "Halbjährlich", "Jährlich", "Einmalig"]
    
    praemie:
      definition: "Einmalige oder laufende Zahlung an den Versicherer"
      note: "Oft synonym mit Beitrag verwendet"
    
    deckung:
      definition: "Leistung, die die Versicherung im Schadenfall erbringt"
      synonyms: ["Versicherungssumme", "Leistung", "Deckungssumme"]
    
    versicherungsnehmer:
      definition: "Person, die den Vertrag abschließt und Beiträge zahlt"
      role: "Vertragspartner des Versicherers"
    
    versicherte_person:
      definition: "Person, deren Risiko versichert ist"
      note: "Kann identisch mit Versicherungsnehmer sein, muss aber nicht"
    
    schadenfall:
      definition: "Ereignis, bei dem die Versicherung leisten muss"
      examples: ["Unfall", "Krankheit", "Tod", "Sachschaden"]
    
    wartezeit:
      definition: "Zeitraum nach Vertragsabschluss, in dem noch kein voller Versicherungsschutz besteht"
      typical_range: "3-24 Monate, je nach Produkt"
    
    selbstbeteiligung:
      definition: "Betrag, den der Versicherte im Schadenfall selbst trägt"
      synonyms: ["Eigenanteil", "Franchise"]
  
  contract_components:
    avb:
      name: "Allgemeine Versicherungsbedingungen"
      description: "Vertragliche Grundlagen, Rechte und Pflichten"
    
    versicherungsschein:
      name: "Versicherungsschein"
      description: "Urkunde über den Versicherungsvertrag"
      synonyms: ["Police"]
    
    widerrufsrecht:
      definition: "Recht, den Vertrag innerhalb einer Frist zu widerrufen"
      standard_period: "30 Tage nach Vertragsabschluss"
  
  common_insurance_types:
    - name: "Lebensversicherung"
      purpose: "Absicherung des Todesfall-Risikos"
    - name: "Sachversicherung"
      purpose: "Absicherung von Sachwerten (z.B. KFZ, Hausrat)"
    - name: "Haftpflichtversicherung"
      purpose: "Absicherung gegen Schadensersatzforderungen"
    - name: "Krankenversicherung"
      purpose: "Absicherung von Gesundheitskosten"

