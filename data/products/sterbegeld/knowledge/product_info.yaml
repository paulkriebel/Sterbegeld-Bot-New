sterbegeldversicherung:
  # ============================================================================
  # PRODUKT-KERNDATEN (für Tarifvergleich)
  # ============================================================================
  versicherungssumme:
    min_eur: 1000
    max_eur: 20000
    empfehlung:
      standard: 8000
      mit_extras: 10000-15000
    hinweis: >
      Versicherungssumme sollte Bestattungskosten und Inflationspuffer abdecken.
  
  beitragsfaktoren:
    - Eintrittsalter
    - Versicherungssumme
    - Gesundheitsprüfung
    - Beitragsdauer (z.B. bis 85 Jahre)
    - Zahlweise (monatlich, jährlich, einmalig)

  tarifvarianten:
    mit_gesundheitspruefung:
      vorteile:
        - Sofortiger Versicherungsschutz (keine Wartezeit)
        - Günstigerer Beitrag
      nachteil: "Nicht für alle Gesundheitszustände geeignet"
    ohne_gesundheitspruefung:
      vorteile:
        - Annahmegarantie
        - Auch bei Vorerkrankungen möglich
      nachteil: "Wartezeit bis volle Leistung"

  wartezeit_logik:
    mit_pruefung: "keine"
    ohne_pruefung:
      typ: "24–36 Monate"
      unfalltod: "volle Leistung sofort"

  beitragsbeispiele:
    versicherungssumme_8000:
      alter_40: "12–18 €/Monat"
      alter_60: "30–45 €/Monat"
      alter_70: "45–65 €/Monat"

  sozialrecht:
    schonvermoegen:
      beschreibung: >
        Versicherungssummen bis ca. 10.000–15.000 € gelten in der Regel als
        angemessenes Schonvermögen im Sozialrecht (§ 90 SGB XII).

  empfehlungen:
    ideal_fuer:
      - Personen ohne ausreichende Rücklagen für Bestattungskosten
      - Sozialhilfeempfänger (Schonvermögen)
      - Alleinstehende mit klaren Bestattungswünschen
    nicht_empfohlen_fuer:
      - Sehr junge Personen (< 30)
      - Personen mit hohem Vermögen

  # ============================================================================
  # ABGRENZUNG (nur in Kurzform)
  # ============================================================================
  abgrenzung:
    risikolebensversicherung: >
      Höhere Summen, Einkommensabsicherung für Hinterbliebene, keine Kapitalbildung.
    bestattungsvorsorgevertrag: >
      Vertrag direkt mit Bestatter; weniger flexibel, keine Kapitalauszahlung.
    sparruecklage: >
      Flexibler, aber kein Pfändungs- oder Sozialschutz.
